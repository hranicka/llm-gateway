host: 0.0.0.0:1234
debug: true
# Bearer token for API clients; browsers use /app/<name>?token=<value> once.
# Empty disables auth — trusted-LAN only (see README "Security").
auth_token: ""
# Host headers the gateway answers as: exact names (ports ignored), or CIDR
# ranges that allow any address in the range as the Host — e.g. browsing via
# any LAN IP. Keep the range(s) matching the home VLAN. Empty list disables
# the check (not recommended).
allowed_hosts:
  - localhost
  - 127.0.0.1
  - 192.168.50.0/24
  # - 192.168.0.0/24
max_body_size: 64MB
auto_unload: 2h
drain_timeout: 5m

models:
  # ══════════════════════════════════════════════════════════════════════════
  # ── eGPU ACCELERATED MODES (16GB NVIDIA RTX 5060 Ti via OCuLink)
  # ══════════════════════════════════════════════════════════════════════════
  # Machine: gem12 — AMD Ryzen 7 8845HS (8c/16t) + 32GB RAM.
  # eGPU:   16GB NVIDIA RTX 5060 Ti over OCuLink (PCIe direct, high bandwidth).

  # MoE models (35B A3B, 26B A4B): --fit puts as many expert tensors in VRAM
  # as fit and the rest on the CPU, measured at load time (replaces the
  # hand-tuned --n-cpu-moe; any explicit -ngl/--n-cpu-moe disables fitting).
  # --fit-target keeps 768 MiB of VRAM free. Every GiB freed in VRAM moves
  # ~2 expert layers back to the GPU = faster decode. Qwen3.6/Ornith KV is
  # tiny: only 10 of 40 layers hold it (~10.6 KiB/token at q8_0). A large
  # ubatch amortizes streaming the CPU-side experts over OCuLink in prefill.
  # Benchmarked on gem12 (Qwen3.6 UD-Q4_K_XL, PCIe x4): ubatch 4096 = ~1716
  # tok/s pp4096 vs ~1403 at 2048; decode ~66 tok/s (short context).
  # GGML_OP_OFFLOAD_MIN_BATCH=1024: batches below 1024 tokens (tool results,
  # chat turns, MTP) compute the RAM experts on the CPU instead of copying
  # them over OCuLink — 3.4x faster at 32 tokens, 1.3x at 512, equal at 1024.
  qwen-3.6-35b:
    command: |
      GGML_OP_OFFLOAD_MIN_BATCH=1024 llama-server
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_XL
      --fit on --fit-target 768 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --image-max-tokens 1024 --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --checkpoint-min-step 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --host 127.0.0.1 --port 1235 --alias qwen-3.6-35b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  ornith-1.5-35b-a3b:
    command: |
      GGML_OP_OFFLOAD_MIN_BATCH=1024 llama-server
      -hf AtomicChat/Ornith-1.5-35B-A3B-GGUF:IQ4_XS
      --fit on --fit-target 768 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 262144 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --no-mmproj --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --checkpoint-min-step 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --host 127.0.0.1 --port 1235 --alias ornith-1.5-35b-a3b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # GSQ-RCO IQ3_S-mtp (11.16 GiB, MTP head embedded) — the best coding
  # quant that fits at 128K: task-lossless (AIME25 100.0, LCB 85.7 = the
  # BF16 base exactly, GPQA-D 89.4; unsloth UD-IQ3_S was 96.7/84.0/89.9,
  # and IQ4_XS at 13.2 GiB does not fit with KV). Per-tensor quant
  # searched under a size budget (ISTA-DASLab GSQ+RCO). Measured on gem12
  # (C-code prompt, medium effort): prefill 755 t/s @34K (= 759 baseline),
  # decode 47.8 t/s with n-max 4 vs 46 with MTP-2 (acceptance is dead
  # past depth ~2; n-max costs nothing). -hff selects the exact file: the
  # "-hf repo:name.gguf" tag form fails — the suffix must be a quant name.
  # CRITICAL: ubatch must stay <= 256 — at 512 the model loads but
  # core-dumps (cuMemCreate/cublas workspace OOM, exit 134) on the first
  # prefill; the GSQ mixed-quant mix needs more runtime slack than the
  # unsloth file did. DFlash2 alternative measured and rejected for this
  # box (decode-priority would flip it back): IQ3_XXS + Q4_K_M drafter,
  # --spec-draft-hf incoai/Qwen3.8-27B-DFlash2-GGUF -md ...Q4_K_M.gguf
  # --spec-type draft-dflash --spec-draft-n-max 7 — decode 51.6 (+8%),
  # prefill 698 (-8%), LCB 84.6 (-1.1), acceptance 0.39/mean 3.7 on code,
  # 15.25 GiB VRAM. mmproj in RAM; --cache-ram parks single-slot prompt
  # states in RAM.
  qwen-3.8-27b:
    command: |
      llama-server
      -hf ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF -hff Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q4_0 --cache-type-v q4_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --image-max-tokens 1024 --image-min-tokens 1024 --jinja --tools all
      --batch-size 256 --ubatch-size 256
      --cache-ram 16384 --ctx-checkpoints 32 --checkpoint-min-step 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --host 127.0.0.1 --port 1235 --alias qwen-3.8-27b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # Same GSQ IQ3_S-mtp stack as qwen-3.8-27b above (quant, ubatch 256
  # ceiling, n-max 4) with thinking disabled and chattier sampling.
  qwen-3.8-27b-instruct:
    command: |
      llama-server
      -hf ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF -hff Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q4_0 --cache-type-v q4_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --image-max-tokens 1024 --image-min-tokens 1024 --jinja --tools all
      --batch-size 256 --ubatch-size 256
      --cache-ram 16384 --ctx-checkpoints 32 --checkpoint-min-step 2048
      --temp 0.7 --top-p 0.80 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --chat-template-kwargs '{"enable_thinking":false}'
      --host 127.0.0.1 --port 1235 --alias qwen-3.8-27b-instruct
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # Fine-tune (uncensored weights), so no GSQ swap — only the free wins
  # from the base-model tuning: n-max 4 (MTP acceptance dies past ~2 but
  # deeper drafting costs nothing) and image-min-tokens. IQ3_M (12.8 GB,
  # MTP head embedded) is ~0.7 GiB larger than unsloth's IQ3_S, so the
  # context stays at 96K for the same VRAM headroom; this conventional
  # quant tolerates ubatch 512 (no GSQ workspace trap). 120K would need
  # the IQ3_XS quant (12.2 GB). The repo ships an mmproj too.
  qwen-3.8-27b-uncensored:
    command: |
      llama-server
      -hf HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF:IQ3_M
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 98304 --cont-batching
      --cache-type-k q4_0 --cache-type-v q4_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --image-max-tokens 1024 --image-min-tokens 1024 --jinja --tools all
      --batch-size 2048 --ubatch-size 512
      --cache-ram 16384 --ctx-checkpoints 32 --checkpoint-min-step 2048
      --spec-type draft-mtp --spec-draft-n-max 4
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --host 127.0.0.1 --port 1235 --alias qwen-3.8-27b-uncensored
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # Official MTP drafter (0.25 GB Q4_0) from the same repo, as for 12B.
  gemma-4-26b:
    command: |
      llama-server
      -hf unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
      --spec-draft-hf unsloth/gemma-4-26B-A4B-it-qat-GGUF -md mtp-gemma-4-26B-A4B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 2
      --fit on --fit-target 768 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --temp 0.6 --top-p 0.9 --top-k 64 --min-p 0.05 --presence-penalty 0.0 --repeat-penalty 1.1
      --host 127.0.0.1 --port 1235 --alias gemma-4-26b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # Dense 7.4 GB, fully in VRAM. Only 8 of 48 layers keep full-context KV
  # (1 KV head, ~8.5 KiB/token at q8_0), the rest is a 1024-token sliding
  # window: the native 256K context costs ~2.1 GiB of KV.
  gemma-4-12b:
    command: |
      llama-server
      -hf HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced:Q4_K_M
      --spec-draft-hf HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced -md mtp-gemma-4-12B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 2
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 262144 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --temp 0.6 --top-p 0.9 --top-k 64 --min-p 0.05 --presence-penalty 0.0 --repeat-penalty 1.1
      --host 127.0.0.1 --port 1235 --alias gemma-4-12b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # ══════════════════════════════════════════════════════════════════════════
  # ── IMAGE GENERATION + EDITING (sd-server from stable-diffusion.cpp, web UI)
  # ══════════════════════════════════════════════════════════════════════════
  # Qwen-Image-2.1: 7B DiT, text-to-image + image editing (up to 10 refs).
  # Diffusion weights: leejet/Qwen-Image-2.1-GGUF, Q4_0 quant — the
  # lightest/fastest option, and small enough that the editing mmproj fits
  # in VRAM too: Q4_0 4.2 GB + Qwen3-VL-8B TE Q4_K_M 4.9 GB + mmproj
  # ~2.5 GB + VAE 0.4 GB ≈ 12 GB resident in the 16 GB VRAM (no PCIe
  # streaming), so 40 steps @ 1024² runs in well under a minute.
  # Defaults: 1024x1024, 40 steps, euler sampling. Quality knobs:
  # --cfg-scale is the guidance strength — the sd.cpp doc value is 6.0;
  # 1.0 (current) skips the guidance pass entirely, ~2x faster but with
  # weaker prompt adherence and small-text rendering. Near-lossless
  # quality alternative: INT8 convrot (DOWNLOAD_INT8=1 in the installer,
  # then point --diffusion-model at qwen_image_2.1_int8_convrot.safetensors
  # — ~6.8 GB, drop --llm_vision to stay in VRAM); GGUF Q6_K sits between.
  # If the stack ever OOMs, re-add --offload-to-cpu (weights then stream
  # from RAM: ~12 GB of 32 GB, but roughly 5x slower per step).
  # Browser: open http://<host>:1234/ and click the app below.
  # API:     POST /v1/images/generations  {"model": "qwen-image-2.1", ...}
  # Install: sudo ./scripts/install-qwen-image-sdcpp.sh
  qwen-image-2.1:
    kind: web
    command: |
      /opt/sdcpp/bin/sd-server
      --diffusion-model /opt/sdcpp/models/qwen_image_2.1-Q4_0.gguf
      --llm /opt/sdcpp/models/Qwen3VL-8B-Instruct-Q4_K_M.gguf
      --llm_vision /opt/sdcpp/models/mmproj-Qwen3VL-8B-Instruct-F16.gguf
      --vae /opt/sdcpp/models/qwen_image_2.1_vae_bf16.safetensors
      --diffusion-fa --cfg-scale 1.0 --sampling-method euler
      --steps 40 --width 1024 --height 1024
      --listen-ip 127.0.0.1 --listen-port 1235
    host: 127.0.0.1:1235
    health_endpoint: /
    ready_timeout: 30m

  # ── COMFYUI (graph workflows: multi-photo composition, masked 1:1 edits) ──
  # Gateway-managed like sd-server: opening it switches the VRAM slot
  # automatically. Weights are symlinked from /opt/sdcpp/models (no extra
  # disk). Install: sudo ./scripts/install-comfyui.sh
  comfyui:
    kind: web
    command: |
      cd /opt/comfyui/ComfyUI && exec /opt/comfyui/venv/bin/python main.py
      --listen 127.0.0.1 --port 8188
    host: 127.0.0.1:8188
    health_endpoint: /
    ready_timeout: 30m
