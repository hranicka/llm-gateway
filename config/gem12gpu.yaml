host: 0.0.0.0:1234
debug: true
# Bearer token for API clients; browsers use /app/<name>?token=<value> once.
# Empty disables auth — trusted-LAN only (see README "Security").
auth_token: ""
# Host headers the gateway answers as: exact names (ports ignored), or CIDR
# ranges that allow any address in the range as the Host — e.g. browsing via
# any LAN IP. Keep the range(s) matching the home VLAN. Empty list disables
# the check (not recommended).
allowed_hosts:
  - localhost
  - 127.0.0.1
  - 192.168.50.0/24
  # - 192.168.0.0/24
max_body_size: 64MB
auto_unload: 2h
drain_timeout: 5m

models:
  # ══════════════════════════════════════════════════════════════════════════
  # ── eGPU ACCELERATED MODES (16GB NVIDIA RTX 5060 Ti via OCuLink)
  # ══════════════════════════════════════════════════════════════════════════
  # Machine: gem12 — AMD Ryzen 7 8845HS (8c/16t) + 32GB RAM.
  # eGPU:   16GB NVIDIA RTX 5060 Ti over OCuLink (PCIe direct, high bandwidth).

  # MoE models (35B A3B, 26B A4B): --fit puts as many expert tensors in VRAM
  # as fit and streams the rest from RAM over OCuLink; --fit-target keeps
  # 768 MiB free. Large ubatch amortizes that streaming in prefill — measured
  # on gem12 (Qwen3.6 UD-Q4_K_XL, PCIe x4): ubatch 4096 = ~1716 t/s pp4096 vs
  # ~1403 at 2048. GGML_OP_OFFLOAD_MIN_BATCH=1024 computes small batches
  # (tool results, chat turns) on the CPU instead of copying them over
  # OCuLink — 3.4x faster at 32 tokens, equal at 1024.
  qwen-3.6-35b:
    command: |
      GGML_OP_OFFLOAD_MIN_BATCH=1024 llama-server
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_XL
      --fit on --fit-target 768 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --image-max-tokens 1024 --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --checkpoint-min-step 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --host 127.0.0.1 --port 1235 --alias qwen-3.6-35b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  ornith-1.5-35b-a3b:
    command: |
      GGML_OP_OFFLOAD_MIN_BATCH=1024 llama-server
      -hf AtomicChat/Ornith-1.5-35B-A3B-GGUF:IQ4_XS
      --fit on --fit-target 768 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 262144 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --no-mmproj --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --checkpoint-min-step 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --host 127.0.0.1 --port 1235 --alias ornith-1.5-35b-a3b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # GSQ-RCO IQ3_S-mtp (11.16 GiB): task-lossless coding quant fitting 128K
  # (AIME 100.0, LCB 85.7, GPQA 89.4). Measured on gem12: prefill 755 t/s
  # @34K, decode 47.8 t/s. ubatch must stay <= 256: at 512 the GSQ mix
  # core-dumps on the first prefill (cublas workspace OOM) — also at
  # spec-draft-n-max >= 6. Decode-first alternative (measured: +8% decode,
  # -8% prefill, -1.1 LCB): GSQ IQ3_XXS + DFlash2 Q4_K_M drafter,
  # draft-dflash n-max 7, ubatch 256. -hff selects the exact file;
  # "-hf repo:file.gguf" fails (suffix = quant name).
  qwen-3.8-27b:
    command: |
      llama-server
      -hf ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF -hff Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q4_0 --cache-type-v q4_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --image-max-tokens 1024 --image-min-tokens 1024 --jinja --tools all
      --batch-size 256 --ubatch-size 256
      --cache-ram 16384 --ctx-checkpoints 32 --checkpoint-min-step 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --host 127.0.0.1 --port 1235 --alias qwen-3.8-27b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # Same GSQ IQ3_S-mtp stack as qwen-3.8-27b above (quant, ubatch 256
  # ceiling, n-max 4) with thinking disabled and chattier sampling.
  qwen-3.8-27b-instruct:
    command: |
      llama-server
      -hf ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF -hff Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
      --spec-type draft-mtp --spec-draft-n-max 4
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q4_0 --cache-type-v q4_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --image-max-tokens 1024 --image-min-tokens 1024 --jinja --tools all
      --batch-size 256 --ubatch-size 256
      --cache-ram 16384 --ctx-checkpoints 32 --checkpoint-min-step 2048
      --temp 0.7 --top-p 0.80 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --chat-template-kwargs '{"enable_thinking":false}'
      --host 127.0.0.1 --port 1235 --alias qwen-3.8-27b-instruct
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # Fine-tune, so no GSQ swap: IQ3_M (12.8 GB) keeps ctx at 96K; conventional
  # quant tolerates ubatch 512 (no GSQ workspace trap). Mirrors the
  # qwen-3.8-27b stack; n-max 4 is the VRAM ceiling (GSQ sibling core-dumps
  # at n-max 6, n-max 8 OOMs at load). Sampling per the repo's thinking
  # preset; batch 2048/ubatch 512 per its example launch. Measured: decode
  # 36.7 t/s, prefill ~807 t/s @2K.
  qwen-3.8-27b-uncensored:
    command: |
      llama-server
      -hf HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF:IQ3_M
      --spec-type draft-mtp --spec-draft-n-max 4
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 98304 --cont-batching
      --cache-type-k q4_0 --cache-type-v q4_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --image-max-tokens 1024 --image-min-tokens 1024 --jinja --tools all
      --batch-size 2048 --ubatch-size 512
      --cache-ram 16384 --ctx-checkpoints 32 --checkpoint-min-step 2048
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --host 127.0.0.1 --port 1235 --alias qwen-3.8-27b-uncensored
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # Official MTP drafter (0.25 GB Q4_0) from the same repo, as for 12B.
  gemma-4-26b:
    command: |
      llama-server
      -hf unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
      --spec-draft-hf unsloth/gemma-4-26B-A4B-it-qat-GGUF -md mtp-gemma-4-26B-A4B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 2
      --fit on --fit-target 768 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --temp 0.6 --top-p 0.9 --top-k 64 --min-p 0.05 --presence-penalty 0.0 --repeat-penalty 1.1
      --host 127.0.0.1 --port 1235 --alias gemma-4-26b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # Dense 7.4 GB, fully in VRAM; only 8 of 48 layers keep full-context KV
  # (1024-token sliding window on the rest) — 262K ctx costs ~2.1 GiB of KV.
  # ubatch must stay <= 2048: at 4096 the ~2.9 GiB compute buffer OOMs beside
  # MTP (2048 vs 4096 prefill: no gain). MTP-6 measured @2K ctx: decode
  # 188-192 t/s vs 97 at n-max 4 and 89 at 2; JSON-heavy worst case 190 vs
  # 98. Drafting degrades with context and stops past ~32K (drafter context
  # limit); decode there ~15 t/s with or without MTP.
  gemma-4-12b:
    command: |
      llama-server
      -hf HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced:Q4_K_M
      --spec-draft-hf HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced -md mtp-gemma-4-12B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 6
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 262144 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --jinja --tools all
      --batch-size 2048 --ubatch-size 2048
      --temp 0.6 --top-p 0.9 --top-k 64 --min-p 0.05 --presence-penalty 0.0 --repeat-penalty 1.1
      --host 127.0.0.1 --port 1235 --alias gemma-4-12b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # ── DECISION MODELS (Cloudflare clef: kind: decision, POST /v1/systemone) ──
  # Read a state + question schema, return per-option probabilities in one
  # forward pass — no text generation. llama-server >= b11430 serves them via
  # /v1/systemone; the gateway routes by the extra "model" body field.
  # Sub-4-bit quants lose extra quality: no imatrix is possible for decision
  # models. clef-flash measured on gem12: 5.56 GiB VRAM with mmproj, ~130 ms
  # per decision over LAN, ~324 input tokens.
  clef-flash:
    kind: decision
    command: |
      llama-server
      -hf bartowski/Cloudflare_clef-flash-GGUF:Q4_K_M
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 32768 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload
      --batch-size 2048 --ubatch-size 2048
      --host 127.0.0.1 --port 1235 --alias clef-flash
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # 27B clef (Qwen3.8-27B base, text-only — mmproj would OOM beside 14.5 GB
  # weights): Q4_K_M is 17.65 GB and doesn't fit 16 GB VRAM; Q3_K_M is the
  # largest quant that does (~15.2 GiB estimated — drop to Q3_K_S, 13.59 GB,
  # if it OOMs at load). ctx 16384 keeps the q8_0 KV small.
  clef:
    kind: decision
    command: |
      llama-server
      -hf bartowski/Cloudflare_clef-GGUF:Q3_K_M
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 16384 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --no-mmproj
      --batch-size 512 --ubatch-size 512
      --host 127.0.0.1 --port 1235 --alias clef
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # ══════════════════════════════════════════════════════════════════════════
  # ── IMAGE GENERATION + EDITING (sd-server from stable-diffusion.cpp, web UI)
  # ══════════════════════════════════════════════════════════════════════════
  # Qwen-Image-2.1: 7B DiT, text-to-image + editing (up to 10 refs). Q4_0
  # diffusion 4.2 GB + Qwen3-VL TE Q4_K_M 4.9 GB + mmproj ~2.5 GB + VAE 0.4 GB
  # ≈ 12 GB resident in VRAM (no PCIe streaming): 40 steps @1024² in well
  # under a minute. --cfg-scale 1.0 skips the guidance pass (~2x faster,
  # weaker prompt adherence; doc value 6.0). Near-lossless alt: INT8 convrot
  # (DOWNLOAD_INT8=1 in the installer, ~6.8 GB, drop --llm_vision); GGUF Q6_K
  # sits between. If OOMs: re-add --offload-to-cpu (~5x slower per step).
  # Browser: http://<host>:1234/ → app below.  API: POST /v1/images/generations
  # Install: sudo ./scripts/install-qwen-image-sdcpp.sh
  qwen-image-2.1:
    kind: web
    command: |
      /opt/sdcpp/bin/sd-server
      --diffusion-model /opt/sdcpp/models/qwen_image_2.1-Q4_0.gguf
      --llm /opt/sdcpp/models/Qwen3VL-8B-Instruct-Q4_K_M.gguf
      --llm_vision /opt/sdcpp/models/mmproj-Qwen3VL-8B-Instruct-F16.gguf
      --vae /opt/sdcpp/models/qwen_image_2.1_vae_bf16.safetensors
      --diffusion-fa --cfg-scale 1.0 --sampling-method euler
      --steps 40 --width 1024 --height 1024
      --listen-ip 127.0.0.1 --listen-port 1235
    host: 127.0.0.1:1235
    health_endpoint: /
    ready_timeout: 30m

  # ── COMFYUI (graph workflows: multi-photo composition, masked 1:1 edits) ──
  # Gateway-managed like sd-server; weights symlinked from /opt/sdcpp/models.
  # Install: sudo ./scripts/install-comfyui.sh
  comfyui:
    kind: web
    command: |
      cd /opt/comfyui/ComfyUI && exec /opt/comfyui/venv/bin/python main.py
      --listen 127.0.0.1 --port 8188
    host: 127.0.0.1:8188
    health_endpoint: /
    ready_timeout: 30m
