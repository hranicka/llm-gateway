host: 0.0.0.0:1234
debug: true
# Bearer token for API clients; browsers use /app/<name>?token=<value> once.
# Empty disables auth — trusted-LAN only (see README "Security").
auth_token: ""
# Host headers the gateway answers as; add the LAN hostname/IP you actually
# browse to. Empty list disables the Host check (not recommended).
allowed_hosts:
  - localhost
  - 127.0.0.1
  - gem12
max_body_size: 64MB
auto_unload: 2h
drain_timeout: 5m

models:
  # ══════════════════════════════════════════════════════════════════════════
  # ── eGPU ACCELERATED MODES (16GB NVIDIA RTX 5060 Ti via OCuLink)
  # ══════════════════════════════════════════════════════════════════════════
  # Machine: gem12 — AMD Ryzen 7 8845HS (8c/16t) + 32GB RAM.
  # eGPU:   16GB NVIDIA RTX 5060 Ti over OCuLink (PCIe direct, high bandwidth).

  qwen-3.6-35b:
    command: |
      llama-server
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_XL
      --n-gpu-layers 999 --n-cpu-moe 18 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --host 127.0.0.1 --port 1235 --alias qwen-3.6-35b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  ornith-1.5-35b-a3b:
    command: |
      llama-server
      -hf AtomicChat/Ornith-1.5-35B-A3B-GGUF:IQ4_XS
      --n-gpu-layers 999 --n-cpu-moe 14 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 184320 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --no-mmproj --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --host 127.0.0.1 --port 1235 --alias ornith-1.5-35b-a3b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  qwen-3.8-27b:
    command: |
      llama-server
      -hf unsloth/Qwen3.8-27B-GGUF:UD-IQ3_S
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 122880 --cont-batching
      --cache-type-k q8_0 --cache-type-v q4_0
      --flash-attn on --load-mode none --no-mmproj --jinja --tools all
      --batch-size 2048 --ubatch-size 256
      --spec-type draft-mtp --spec-draft-n-max 2
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --host 127.0.0.1 --port 1235 --alias qwen-3.8-27b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  qwen-3.8-27b-instruct:
    command: |
      llama-server
      -hf unsloth/Qwen3.8-27B-GGUF:UD-IQ3_S
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 122880 --cont-batching
      --cache-type-k q8_0 --cache-type-v q4_0
      --flash-attn on --load-mode none --no-mmproj --jinja --tools all
      --batch-size 4096 --ubatch-size 256
      --spec-type draft-mtp --spec-draft-n-max 2
      --temp 0.7 --top-p 0.80 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0
      --chat-template-kwargs '{"enable_thinking":false}'
      --host 127.0.0.1 --port 1235 --alias qwen-3.8-27b-instruct
    host: 127.0.0.1:1235
    ready_timeout: 2h

  gemma-4-26b:
    command: |
      llama-server
      -hf unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
      --n-gpu-layers 999 --n-cpu-moe 5 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --temp 0.6 --top-p 0.9 --top-k 64 --min-p 0.05 --presence-penalty 0.0 --repeat-penalty 1.1
      --host 127.0.0.1 --port 1235 --alias gemma-4-26b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  gemma-4-12b:
    command: |
      llama-server
      -hf HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced:Q4_K_M
      --spec-draft-hf HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced -md mtp-gemma-4-12B-it.gguf
      --spec-type draft-mtp --spec-draft-n-max 2
      --n-gpu-layers 999 --parallel 1 --threads 8 --threads-batch 8
      --ctx-size 131072 --cont-batching
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --load-mode none --mmproj-auto --no-mmproj-offload --jinja --tools all
      --batch-size 4096 --ubatch-size 4096
      --temp 0.6 --top-p 0.9 --top-k 64 --min-p 0.05 --presence-penalty 0.0 --repeat-penalty 1.1
      --host 127.0.0.1 --port 1235 --alias gemma-4-12b
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # ══════════════════════════════════════════════════════════════════════════
  # ── IMAGE GENERATION + EDITING (sd-server from stable-diffusion.cpp, web UI)
  # ══════════════════════════════════════════════════════════════════════════
  # Qwen-Image-2.1: 7B DiT, text-to-image + image editing (up to 10 refs).
  # Diffusion weights: leejet/Qwen-Image-2.1-GGUF, Q4_0 quant — the
  # lightest/fastest option, and small enough that the editing mmproj fits
  # in VRAM too: Q4_0 4.2 GB + Qwen3-VL-8B TE Q4_K_M 4.9 GB + mmproj
  # ~2.5 GB + VAE 0.4 GB ≈ 12 GB resident in the 16 GB VRAM (no PCIe
  # streaming), so 40 steps @ 1024² runs in well under a minute.
  # Defaults: 1024x1024, 40 steps, euler sampling. Quality knobs:
  # --cfg-scale is the guidance strength — the sd.cpp doc value is 6.0;
  # 1.0 (current) skips the guidance pass entirely, ~2x faster but with
  # weaker prompt adherence and small-text rendering. Near-lossless
  # quality alternative: INT8 convrot (DOWNLOAD_INT8=1 in the installer,
  # then point --diffusion-model at qwen_image_2.1_int8_convrot.safetensors
  # — ~6.8 GB, drop --llm_vision to stay in VRAM); GGUF Q6_K sits between.
  # If the stack ever OOMs, re-add --offload-to-cpu (weights then stream
  # from RAM: ~12 GB of 32 GB, but roughly 5x slower per step).
  # Browser: open http://<host>:1234/ and click the app below.
  # API:     POST /v1/images/generations  {"model": "qwen-image-2.1", ...}
  # Install: sudo ./scripts/install-qwen-image-sdcpp.sh
  qwen-image-2.1:
    kind: web
    command: |
      /opt/sdcpp/bin/sd-server
      --diffusion-model /opt/sdcpp/models/qwen_image_2.1-Q4_0.gguf
      --llm /opt/sdcpp/models/Qwen3VL-8B-Instruct-Q4_K_M.gguf
      --llm_vision /opt/sdcpp/models/mmproj-Qwen3VL-8B-Instruct-F16.gguf
      --vae /opt/sdcpp/models/qwen_image_2.1_vae_bf16.safetensors
      --diffusion-fa --cfg-scale 1.0 --sampling-method euler
      --steps 40 --width 1024 --height 1024
      --listen-ip 127.0.0.1 --listen-port 1235
    host: 127.0.0.1:1235
    health_endpoint: /
    ready_timeout: 30m

  # ── COMFYUI (graph workflows: multi-photo composition, masked 1:1 edits) ──
  # Gateway-managed like sd-server: opening it switches the VRAM slot
  # automatically. Weights are symlinked from /opt/sdcpp/models (no extra
  # disk). Install: sudo ./scripts/install-comfyui.sh
  comfyui:
    kind: web
    command: |
      cd /opt/comfyui/ComfyUI && exec /opt/comfyui/venv/bin/python main.py
      --listen 127.0.0.1 --port 8188
    host: 127.0.0.1:8188
    health_endpoint: /
    ready_timeout: 30m
