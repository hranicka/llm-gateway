providers:
  # One streamed or non-streamed request to network-gem12 at a time.
  maxInFlightRequests:
    network-gem12: 1

async:
  # Keep the main agent paused while delegated task work is active.
  enabled: false

task:
  # Run at most one agent at a time against the single-slot gem12 backend.
  maxConcurrency: 1
