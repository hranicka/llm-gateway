modelRoles:
  # Every role rides the single-slot qwen-3.8-27b; only the reasoning effort
  # varies (a model switch would reload llama-server, ~2.5 min).
  default: network-gem12/qwen-3.8-27b:medium
  plan: network-gem12/qwen-3.8-27b:xhigh
  slow: network-gem12/qwen-3.8-27b:xhigh
  task: network-gem12/qwen-3.8-27b:low
  smol: network-gem12/qwen-3.8-27b:low
  tiny: network-gem12/qwen-3.8-27b:low
  commit: network-gem12/qwen-3.8-27b:low
  # Vision role: qwen-3.8-27b loads its mmproj on the CPU, so images no
  # longer swap models. Fallback if vision misbehaves: network-gem12/qwen-3.8-27b-uncensored.
  vision: network-gem12/qwen-3.8-27b:low

providers:
  # Serialize all llm-gateway traffic: per-provider limit, shared across omp
  # processes, held until the streamed response finishes — one llama-server
  # slot (--parallel 1), concurrency would re-prefill.
  maxInFlightRequests:
    network-gem12: 1
  # Cold 100K prefill ~3 min; 15 min timeout for the first token and stream
  # pauses (never give up early: abandoned requests keep the slot busy).
  streamFirstEventTimeoutSeconds: 900
  streamIdleTimeoutSeconds: 900

async:
  # A task call blocks the main agent (one llama-server slot, no concurrency).
  enabled: false

task:
  # At most one agent at a time: gem12 serves llama-server with --parallel 1.
  maxConcurrency: 1

# Requests with no role run "gold middle path"; roles above pin their own levels.
defaultThinkingLevel: medium

tools:
  # Spill big tool output: every inline token is re-prefilled every turn.
  artifactSpillThreshold: 10
  artifactHeadBytes: 10
  artifactTailBytes: 10

compaction:
  # Summarize only near the window — compaction loses the warm KV prefix.
  # A percentage follows each model's contextWindow: ~107K qwen-3.8-27b,
  # ~80K uncensored, ~215K Ornith.
  thresholdPercent: 82

provider:
  # llama-server caches the KV prefix; append-only keeps turns fast.
  appendOnlyContext: "on"
