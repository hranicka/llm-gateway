modelRoles:
  # Main and automatic subagent roles share one gateway model. Manual model
  # selection remains available, but role scheduling cannot reload the backend.
  default: network-gem12/ornith-1.5-35b-a3b

providers:
  # Serialize ALL llm-gateway traffic (main agent, task subagents, advisor,
  # background jobs, retries): providers.maxInFlightRequests is omp's
  # documented per-provider limit, shared across local omp processes, lease
  # held until each streamed response finishes. gem12 serves llama-server
  # with --parallel 1 (single slot), so anything concurrent re-prefills.
  maxInFlightRequests:
    network-gem12: 1

async:
  # A task call blocks the main agent until its delegated work is complete.
  # This prevents the main agent and a task agent from running concurrently.
  enabled: false

task:
  # A batched task call still delegates, but runs its task agents sequentially.
  maxConcurrency: 1
  # Prefer delegating suitable work despite the single-agent execution limit.
  eager: preferred
  # Never hand a task to the smol role mid-run; that would start another context.
  prewalk: false

prewalk:
  # Never hand the primary agent to smol at its first edit.
  enabled: false
