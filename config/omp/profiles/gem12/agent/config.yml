modelRoles:
  # Every role rides the single-slot qwen-3.8-27b-exl3; only the reasoning
  # effort varies (a model switch would reload the backend, ~1-2.5 min).
  default: network-gem12/qwen-3.8-27b-exl3:medium
  plan: network-gem12/qwen-3.8-27b-exl3:xhigh
  slow: network-gem12/qwen-3.8-27b-exl3:xhigh
  task: network-gem12/qwen-3.8-27b-exl3:low
  smol: network-gem12/qwen-3.8-27b-exl3:low
  tiny: network-gem12/qwen-3.8-27b-exl3:low
  commit: network-gem12/qwen-3.8-27b-exl3:low
  # Vision role: qwen-3.8-27b-exl3 runs its vision tower on the GPU, so images
  # never swap models. Fallback if vision misbehaves: network-gem12/gemma-4-12b.
  vision: network-gem12/qwen-3.8-27b-exl3:low

providers:
  # Serialize all llm-gateway traffic: per-provider limit, shared across omp
  # processes, held until the streamed response finishes — one backend
  # slot, concurrency would re-prefill.
  maxInFlightRequests:
    network-gem12: 1
  # Cold 100K prefill ~3 min; 15 min timeout for the first token and stream
  # pauses (never give up early: abandoned requests keep the slot busy).
  streamFirstEventTimeoutSeconds: 900
  streamIdleTimeoutSeconds: 900

async:
  # A task call blocks the main agent (one backend slot, no concurrency).
  enabled: false

task:
  # At most one agent at a time: gem12 serves one request at a time.
  maxConcurrency: 1

# Requests with no role run "gold middle path"; roles above pin their own levels.
defaultThinkingLevel: medium

tools:
  # Spill big tool output: every inline token is re-prefilled every turn.
  artifactSpillThreshold: 10
  artifactHeadBytes: 10
  artifactTailBytes: 10

compaction:
  # Summarize only near the window — compaction loses the warm KV prefix.
  # A percentage follows each model's contextWindow: ~107K qwen-3.8-27b-exl3,
  # ~80K uncensored, ~215K Ornith.
  thresholdPercent: 82

provider:
  # The backend caches the KV prefix; append-only keeps turns fast.
  appendOnlyContext: "on"
