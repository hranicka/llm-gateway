        cost: { input: 0.05, output: 0.8, cacheRead: 0.005, cacheWrite: 0 }
        input: [text]
        # Cold-cache prefill of ~100K tokens can run 10+ min on the eGPU.
        timeout: 1800
        thinking:
          mode: effort
          # Qwen3.8 template accepts reasoning_effort low/medium/xhigh only
          # (high is aliased to xhigh); "minimal" would abort the template.
          efforts: [low, medium, xhigh]
          # Resolves the "auto" level; matches the gateway startup default.
