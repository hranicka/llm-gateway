providers:
  network-gem12:
    baseUrl: http://192.168.50.103:1234/v1
    api: openai-completions
    auth: none
    models:
      - id: ornith-1.5-35b-a3b
        name: Ornith 1.5 35B A3B
        contextWindow: 262144
        maxTokens: 16384
        # Pricing: 300 W @ 7 CZK/kWh, ~550 tok/s prefill (~$0.05/M), ~35 tok/s decode (~$0.80/M); KV hits ~ free.
        cost: { input: 0.05, output: 0.8, cacheRead: 0.005, cacheWrite: 0 }
        input: [text]
      - id: qwen-3.8-27b
        name: Qwen 3.8 27B
        reasoning: true
        contextWindow: 131072
        # Room for thinking (budget-capped) plus large file writes. The cap
        # also keeps a reply at the compaction trigger inside the window.
        maxTokens: 20480
        # Pricing: 300 W @ 7 CZK/kWh, ~750 tok/s prefill (~$0.04/M), ~48 tok/s decode (~$0.60/M); KV hits ~ free.
        cost: { input: 0.04, output: 0.6, cacheRead: 0.005, cacheWrite: 0 }
        # Vision via mmproj encoded on the CPU (no VRAM cost).
        input: [text, image]
        # Cold 100K prefill ~3 min (benchmarked); headroom for CPU image encoding.
        timeout: 1800
        thinking:
          mode: effort
          # Template accepts low/medium/xhigh only ("minimal" aborts).
          efforts: [low, medium, xhigh]
          # "auto" → medium (gateway startup default); "off" allowed — the
          # non-thinking (instruct) mode of the same loaded weights.
          defaultLevel: medium
          requiresEffort: false
        compat:
          # Effort rides chat_template_kwargs.reasoning_effort, merged over
          # the startup default; enable_thinking: false = thinking off.
          qwenTemplateReasoningEffort: true
          reasoningDisableMode: qwen-template-false
          supportsReasoningEffort: true
          supportsReasoningParams: true
          thinkingFormat: qwen
          extraBody:
            # Cap thinking tokens per reply. Both names: builds before
            # llama.cpp b9982 honour only the thinking_ alias, newer ones the
            # reasoning_ field.
            reasoning_budget_tokens: 7500
            thinking_budget_tokens: 7500
      - id: gemma-4-12b
        name: Gemma 4 12B
        contextWindow: 262144
        maxTokens: 16384
        # Pricing: 300 W @ 7 CZK/kWh, ~550 tok/s prefill (~$0.05/M), ~35 tok/s decode (~$0.80/M); KV hits ~ free.
        cost: { input: 0.05, output: 0.8, cacheRead: 0.005, cacheWrite: 0 }
        input: [text, image]
      - id: qwen-3.8-27b-uncensored
        name: Qwen 3.8 27B Uncensored
        reasoning: true
        contextWindow: 98304
        # Room for thinking (budget-capped) plus large file writes. The cap
        # also keeps a reply at the compaction trigger inside the window.
        maxTokens: 20480
        # Pricing: 300 W @ 7 CZK/kWh, ~550 tok/s prefill (~$0.05/M), ~35 tok/s decode (~$0.80/M); KV hits ~ free.
        cost: { input: 0.05, output: 0.8, cacheRead: 0.005, cacheWrite: 0 }
        # Vision via mmproj encoded on the CPU (no VRAM cost).
        input: [text, image]
        # Cold 100K prefill ~3 min on the eGPU.
        timeout: 1800
        thinking:
          mode: effort
          # Template accepts low/medium/xhigh only ("minimal" aborts).
          efforts: [low, medium, xhigh]
          # "auto" → medium (gateway startup default); "off" allowed.
          defaultLevel: medium
          requiresEffort: false
        compat:
          # Effort rides chat_template_kwargs.reasoning_effort, merged over
          # the startup default; enable_thinking: false = thinking off.
          qwenTemplateReasoningEffort: true
          reasoningDisableMode: qwen-template-false
          supportsReasoningEffort: true
          supportsReasoningParams: true
          thinkingFormat: qwen
          extraBody:
            # Cap thinking tokens per reply. Both names: builds before
            # llama.cpp b9982 honour only the thinking_ alias, newer ones the
            # reasoning_ field.
            reasoning_budget_tokens: 7500
            thinking_budget_tokens: 7500

  local-laptop:
    baseUrl: http://127.0.0.1:1234/v1
    api: openai-completions
    auth: none
    models:
      - id: qwen-3.5-4b
        name: Qwen 3.5 4B
        contextWindow: 16384
        maxTokens: 8192
      - id: gemma-4-2b
        name: Gemma 4 2B
        contextWindow: 16384
        maxTokens: 8192

