# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# gem12 serves one llama-server slot: subagents must run sequentially.
# Default maxActiveSubagents is 8 — parallel subagents would queue at the
# gateway's single generation slot (stall) or swap models mid-task.
# maxDepth stays at its default 1. Patch ids must match existing row ids —
# `subagent` here; a custom label warns "entry not found" and no-ops.
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxActiveSubagents: 1

# llm-gateway models (gem12 eGPU + laptop), same set as opencode/omp.
# Mirrored in the llm-gateway repo at config/dsh/profiles/gem12/cordis.patch.yml.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      network-gem12:
        displayName: Network Gem12
        api: openai-completions
        baseURL: http://192.168.50.103:1234/v1
        # Gateway is keyless (trusted LAN, auth_token: ""). pi-ai still insists
        # on a credential for OpenAI-compatible endpoints; a placeholder
        # Authorization header satisfies it and llama-server ignores the value.
        headers:
          Authorization: Bearer unused
        # Cold 100K prefill ~3 min on the eGPU; 30 min request cap and 15 min
        # stream-idle watchdog (first token counts as idle) never give up early.
        timeoutMs: 1800000
        streamIdleTimeoutMs: 900000
        compat:
          # Send the system prompt as "system" (llama-server has no developer role).
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          # Qwen3.8 dialect on llama-server --jinja: everything rides
          # chat_template_kwargs; enable_thinking false is the off switch,
          # reasoning_effort carries the level (template accepts
          # low/medium/xhigh only). Startup default is medium (--chat-template-kwargs).
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true
            preserve_thinking: true
          # llama.cpp's thinking-budget request field (the alias honoured by
          # every build). Budget per effort level: xhigh reads the "high"
          # bucket and gets room for plan/slow work; low stays quick.
          thinkingTokenBudgetField: thinking_budget_tokens
        thinkingBudgets:
          minimal: 4000
          low: 4000
          medium: 7500
          high: 12000
        models:
          - id: ornith-1.5-35b-a3b
            name: Ornith 1.5 35B A3B
            contextWindow: 262144
            maxTokens: 16384
          - id: qwen-3.8-27b
            name: Qwen 3.8 27B
            contextWindow: 131072
            # Output cap = reserve in the compaction trigger (see the preset
            # below): thinking is budget-capped at 4000/7500/12000, leaving
            # 8K+ for tool calls and file writes.
            maxTokens: 20480
            # Vision via mmproj encoded on the CPU.
            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              xhigh: xhigh
          - id: qwen-3.8-27b-uncensored
            name: Qwen 3.8 27B Uncensored
            contextWindow: 98304
            maxTokens: 20480
            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              xhigh: xhigh
          - id: gemma-4-12b
            name: Gemma 4 12B
            contextWindow: 262144
            maxTokens: 16384
            input: [text, image]
      local-laptop:
        displayName: Local Laptop
        api: openai-completions
        baseURL: http://127.0.0.1:1234/v1
        headers:
          Authorization: Bearer unused
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: qwen-3.5-4b
            name: Qwen 3.5 4B
            contextWindow: 16384
            maxTokens: 8192
          - id: gemma-4-2b
            name: Gemma 4 2B
            contextWindow: 16384
            maxTokens: 8192

# New sessions default to the local eGPU instead of the DeepSeek account;
# pick the effort per session in the model selector. The dsh UI drops
# comments when saving settings — re-sync from this repo copy.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: network-gem12
    model: qwen-3.8-27b
    reasoningEffort: medium

# Agent presets. Preset plugin rows are NOT reachable by patch id (the loader
# patch map indexes top-level rows only, and the host-plane compaction-basic row
# is disabled by dsh-web-app) — so compaction tuning rides on full preset
# copies. Both entries below are the installed dsh-web-app
# presets/standard.patch.yml with compaction-basic tuned for local windows.
#
# Trigger = floor(min(W * thresholdRatio, W - O - headroomTokens)), W = context
# window, O = the route's maxTokens (output reserve). Stock (ratio 0.8,
# headroom 65536) compacts at ~33K on a 131K window. Here: ratio 0.9,
# headroom 4096, O 20480:
#   131072 windows (qwen-3.8-27b)  -> 106496
#    98304 (uncensored)            ->  73728
#   262144 (ornith, O 16384)       -> 235929 (the ratio binds)
# Each 4096 tokens of maxTokens moves the trigger by 4096; thinking budgets
# (4000/7500/12000) are sized to leave 8K+ of answer room under that cap.
# Compaction keeps the newest 16% of W - O verbatim (~17K) plus the summary
# (cap 20480 = the output reserve, so the summary request at the trigger still
# fits; thinking tokens count against it and a truncated summary is discarded).
# Overflow errors from the server still trigger one reactive compaction.
# Regenerate both from the installed preset on dsh updates.
#

- id: preset-standard
  name: "@deepseek-ai/dsh-agent-preset"
  config:
    id: standard
    description: Standard tools; compaction tuned for local models (ratio 0.9, headroom 4096, trigger ~106K on 131K windows).
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            config:
              thresholdRatio: 0.9
              headroomTokens: 4096
              maxTokens: 20480
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true

