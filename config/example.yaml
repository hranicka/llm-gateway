host: 0.0.0.0:1234
debug: true
auto_unload: 2h
drain_timeout: 30s

models:
  # ── llama-server (GGUF) ─────────────────────────────────────────────
  your-model-name:
    command: |
      llama-server
      -hf org/repo:quant
      --no-mmproj -ngl 99 -fa on -np 1 -t 8 -tb 8 -c 32000
      -b 512 -ub 512 --no-warmup
      --cache-type-k q5_0 --cache-type-v q5_0 -cb
      --temp 0.7 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
      --host 127.0.0.1 --port 1235 --alias your-model-name
    host: 127.0.0.1:1235
    ready_timeout: 2h

  # ── vllm serve (safetensors / NVFP4 + fp8 KV) ───────────────────────────────
  # your-model-name:
  #   command: |
  #     vllm serve org/repo-name
  #     --served-model-name your-model-name
  #     --port 1235 --max-model-len 131072 --kv-cache-dtype fp8
  #   host: 127.0.0.1:1235
  #   health_endpoint: /v1/models        # vllm has no /health endpoint
  #   ready_timeout: 4h
  #
  # ── sd-server (stable-diffusion.cpp) — image generation with a web UI ──────
  # kind: web serves the backend's browser UI through the gateway: open
  # http://<gateway>/ and click the app (or /app/<name> directly). The same
  # backend also answers OpenAI-style POST /v1/images/generations.
  # qwen-image-2.1:
  #   kind: web
  #   command: |
  #     /opt/sdcpp/bin/sd-server
  #     --diffusion-model /opt/sdcpp/models/qwen_image_2.1-Q6_K.gguf
  #     --llm /opt/sdcpp/models/Qwen3VL-8B-Instruct-Q4_K_M.gguf
  #     --llm_vision /opt/sdcpp/models/Qwen3VL-8B-Instruct-mmproj-BF16.gguf
  #     --vae /opt/sdcpp/models/qwen_image_2.1_vae_bf16.safetensors
  #     --diffusion-fa --cfg-scale 6.0 --offload-to-cpu
  #     --listen-ip 127.0.0.1 --listen-port 1235
  #   host: 127.0.0.1:1235
  #   health_endpoint: /                 # web apps have no /health; poll the UI page
  #   ready_timeout: 15m
  #
  # ── ComfyUI — graph-based image workflows (alternative web app) ────────────
  # Install ComfyUI, the leejet/ComfyUI-GGUF custom node and GGUF models, then:
  # comfyui:
  #   kind: web
  #   command: |
  #     cd /opt/ComfyUI && exec venv/bin/python main.py --listen 127.0.0.1 --port 1235
  #   host: 127.0.0.1:1235
  #   health_endpoint: /
  #   ready_timeout: 15m
